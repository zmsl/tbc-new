name: Desktop Build

# Builds the Electron desktop app. Called by Release to publish installers, and by Desktop on
# pull requests that touch the app, where the installers are kept as run artifacts instead.
#
# Permissions are deliberately not declared here: a called workflow cannot ask for more than its
# caller granted, so the caller decides (contents: write to publish, contents: read otherwise).
on:
    workflow_call:
        inputs:
            ref:
                description: 'Commit reference to build'
                required: false
                type: string
            tag:
                description: 'Version tag; electron-updater compares releases against it'
                required: true
                type: string
            publish:
                description: 'Attach the installers to the release for this tag'
                required: false
                default: false
                type: boolean

jobs:
    # The Go sim engine that ships inside the desktop bundle. Built on Linux because the
    # makefile depends on Unix tooling for the client build, and Go cross-compiles the
    # per-platform sidecars from here without any extra toolchain.
    sidecars:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build sidecars 🔧
              run: VERSION=${{ inputs.tag }} make desktop-sidecar-win desktop-sidecar-mac

            - name: Upload sidecars
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-sidecars
                  path: desktop/build/sidecar/
                  retention-days: 1

    # Installers must be built on their own platform: dmg creation needs macOS, and building
    # NSIS on Windows keeps the door open for code signing later.
    #
    # The architectures are named explicitly. Passing targets on the command line replaces the
    # target block in electron-builder.yml, arch list included, and what is left is the runner's
    # own architecture -- which is how the Intel mac build silently disappeared when the hosted
    # macOS runners moved to Apple Silicon.
    package:
        needs: sidecars
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      args: --win nsis --x64
                      artifacts: desktop-dist/*.exe,desktop-dist/*.blockmap,desktop-dist/latest.yml
                    - os: macos-latest
                      args: --mac dmg zip --x64 --arm64
                      artifacts: desktop-dist/*.dmg,desktop-dist/*.zip,desktop-dist/*.blockmap,desktop-dist/latest-mac.yml
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ inputs.ref }}

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: desktop/package-lock.json

            - name: Download sidecars
              uses: actions/download-artifact@v4
              with:
                  name: desktop-sidecars
                  path: desktop/build/sidecar

            - name: Stage icon and restore sidecar permissions
              shell: bash
              run: |
                  cp assets/favicon_io/android-chrome-512x512.png desktop/build/icon.png
                  chmod +x desktop/build/sidecar/* || true

            # electron-updater compares releases against this version. If it drifts from the
            # tag, the app never sees the update it is sitting on.
            - name: Set desktop version
              shell: bash
              working-directory: desktop
              run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
              env:
                  TAG: ${{ inputs.tag }}

            - name: Install desktop dependencies
              working-directory: desktop
              run: npm ci

            - name: Build installer 🔧
              working-directory: desktop
              run: npx electron-builder ${{ matrix.args }} --publish never

            # prerelease/makeLatest are repeated here, not just set once when the release is
            # created: this step updates the same release, and leaving them out lets the update
            # promote a prerelease back to Latest.
            - name: Attach to release
              if: inputs.publish
              uses: ncipollo/release-action@v1
              with:
                  tag: ${{ inputs.tag }}
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  updateOnlyUnreleased: false
                  prerelease: ${{ contains(inputs.tag, '-') }}
                  makeLatest: ${{ !contains(inputs.tag, '-') }}
                  artifactErrorsFailBuild: true
                  artifacts: ${{ matrix.artifacts }}

            # Without a release to attach to, the installers are still worth keeping: they are
            # the only way to check that a pull request did not break packaging. The unpacked
            # build directory is left out on purpose -- it is several hundred megabytes.
            - name: Upload installers
              if: ${{ !inputs.publish }}
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-installer-${{ matrix.os }}
                  path: |
                      desktop-dist/*.exe
                      desktop-dist/*.dmg
                      desktop-dist/*.zip
                  if-no-files-found: error
                  retention-days: 7
