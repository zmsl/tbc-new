name: Release

on:
    workflow_dispatch:
        # Inputs the workflow accepts.
        inputs:
            ref:
                description: 'Commit Reference'
                default: 'master'
                required: true
            tag:
                description: 'Version Tag'
                default: 'v0.0.0'
                required: true

jobs:
    tests:
        uses: ./.github/workflows/run_tests.yml
        with:
            ref: ${{ github.event.inputs.ref }}

    build-and-release:
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build 🔧
              run: |
                  make clean && VERSION=${{ github.event.inputs.tag }} make release

            - name: Release
              uses: ncipollo/release-action@v1
              with:
                  commit: ${{ github.event.inputs.ref }}
                  tag: ${{ github.event.inputs.tag }}
                  generateReleaseNotes: true
                  makeLatest: true
                  artifactErrorsFailBuild: true
                  artifacts: |
                      wowsimcli-amd64-linux.zip
                      wowsimcli-windows.exe.zip
                      wowsimcli-arm64-darwin.zip
                      wowsimtbc-amd64-darwin.zip
                      wowsimtbc-arm64-darwin.zip
                      wowsimtbc-amd64-linux.zip
                      wowsimtbc-windows.exe.zip

    # The Go sim engine that ships inside the desktop bundle. Built on Linux because the
    # makefile depends on Unix tooling for the client build, and Go cross-compiles the
    # per-platform sidecars from here without any extra toolchain.
    desktop-sidecars:
        needs: tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.25.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build sidecars 🔧
              run: VERSION=${{ github.event.inputs.tag }} make desktop-sidecar-win desktop-sidecar-mac

            - name: Upload sidecars
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-sidecars
                  path: desktop/build/sidecar/
                  retention-days: 1

    # Installers must be built on their own platform: dmg creation needs macOS, and building
    # NSIS on Windows keeps the door open for code signing later.
    desktop-package:
        needs: [desktop-sidecars, build-and-release]
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      args: --win nsis
                      artifacts: desktop-dist/*.exe,desktop-dist/*.blockmap,desktop-dist/latest.yml
                    - os: macos-latest
                      args: --mac dmg zip
                      artifacts: desktop-dist/*.dmg,desktop-dist/*.zip,desktop-dist/*.blockmap,desktop-dist/latest-mac.yml
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: desktop/package-lock.json

            - name: Download sidecars
              uses: actions/download-artifact@v4
              with:
                  name: desktop-sidecars
                  path: desktop/build/sidecar

            - name: Stage icon and restore sidecar permissions
              shell: bash
              run: |
                  cp assets/favicon_io/android-chrome-512x512.png desktop/build/icon.png
                  chmod +x desktop/build/sidecar/* || true

            # electron-updater compares releases against this version. If it drifts from the
            # tag, the app never sees the update it is sitting on.
            - name: Set desktop version
              shell: bash
              working-directory: desktop
              run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"
              env:
                  TAG: ${{ github.event.inputs.tag }}

            - name: Install desktop dependencies
              working-directory: desktop
              run: npm ci

            - name: Build installer 🔧
              working-directory: desktop
              run: npx electron-builder ${{ matrix.args }} --publish never

            - name: Attach to release
              uses: ncipollo/release-action@v1
              with:
                  tag: ${{ github.event.inputs.tag }}
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  updateOnlyUnreleased: false
                  artifactErrorsFailBuild: true
                  artifacts: ${{ matrix.artifacts }}
