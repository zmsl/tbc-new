name: Release

on:
    workflow_dispatch:
        # Inputs the workflow accepts.
        inputs:
            ref:
                description: 'Commit Reference'
                default: 'master'
                required: true
            tag:
                description: 'Version Tag'
                default: 'v0.0.0'
                required: true

jobs:
    tests:
        uses: ./.github/workflows/run_tests.yml
        with:
            ref: ${{ github.event.inputs.ref }}

    build-and-release:
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  ref: ${{ github.event.inputs.ref }}

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.27.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build 🔧
              run: |
                  make clean && VERSION=${{ github.event.inputs.tag }} make release

            # One bundle per platform, stamped with the tag: Claude Desktop compares that
            # version against what is installed to decide whether an update exists.
            - name: Pack MCP bundles 🔧
              run: make mcp-bundle MCPB_VERSION=${TAG#v}
              env:
                  TAG: ${{ github.event.inputs.tag }}

            # A tag carrying a semver prerelease part (v0.0.132-rc1) is published as a
            # prerelease and does not become Latest. That keeps a test build off the download
            # page and out of the desktop updater, which ignores prereleases unless the app
            # opts in -- desktop/main.js does not.
            - name: Release
              uses: ncipollo/release-action@v1
              with:
                  commit: ${{ github.event.inputs.ref }}
                  tag: ${{ github.event.inputs.tag }}
                  generateReleaseNotes: true
                  prerelease: ${{ contains(github.event.inputs.tag, '-') }}
                  makeLatest: ${{ !contains(github.event.inputs.tag, '-') }}
                  artifactErrorsFailBuild: true
                  artifacts: |
                      wowsimcli-amd64-linux.zip
                      wowsimcli-windows.exe.zip
                      wowsimcli-arm64-darwin.zip
                      wowsimtbc-amd64-darwin.zip
                      wowsimtbc-arm64-darwin.zip
                      wowsimtbc-amd64-linux.zip
                      wowsimtbc-windows.exe.zip
                      mcp/dist/*.mcpb

    # Installers for the Electron app, built by the same workflow that pull requests use.
    desktop:
        needs: [tests, build-and-release]
        permissions:
            contents: write
        uses: ./.github/workflows/desktop_build.yml
        with:
            ref: ${{ github.event.inputs.ref }}
            tag: ${{ github.event.inputs.tag }}
            publish: true
