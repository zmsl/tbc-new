name: Build and Deploy
on:
    push:
        branches:
            - master
jobs:
    tests:
        uses: ./.github/workflows/run_tests.yml

    # Upstream only. This job publishes wowsims.com/tbc by force-pushing the built client to
    # wowsims/pages-deploy, using a token no fork has -- and a fork that did have one would
    # overwrite the live site with its own build. It also opens and auto-merges a pull request
    # whenever .deployedprotoversion moves, which records what is live on that site and means
    # nothing anywhere else.
    #
    # The tests job above still runs everywhere, so a fork keeps its master-push signal; nothing
    # is lost by skipping this, because tests/build-ui already builds the client.
    build-and-deploy:
        needs: tests
        if: github.repository == 'wowsims/tbc-new'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v5
              with:
                  persist-credentials: false

            - name: Install Go
              uses: actions/setup-go@v6
              with:
                  go-version: 1.27.x

            - name: Install Protoc
              uses: arduino/setup-protoc@v3
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install Protoc Go plugin
              run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest

            - name: Install Node
              uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Install binaryen
              run: sudo apt-get update && sudo apt-get install -y binaryen

            - name: Build 🔧
              run: |
                  make dist/tbc/.dirstamp

            - name: Update proto version file
              run: |
                  cp sim/core/TestProtoVersioning.results .deployedprotoversion

            - name: Commit updated version file
              run: |
                  git config --local user.name "github-actions[bot]"
                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if ! git diff --exit-code; then
                      git checkout -b github-actions
                      git add .deployedprotoversion
                      git commit -m "Auto-update .deployedprotoversion file due to API version increase"
                      git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
                      git push --set-upstream origin github-actions
                      gh pr create --fill
                      gh pr merge --merge --delete-branch
                  fi
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Deploy 🚀
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  repository-name: wowsims/pages-deploy
                  branch: main
                  folder: dist/tbc
                  target-folder: tbc
                  single-commit: true
                  token: ${{ secrets.DEPLOY_REPO_TOKEN }}
